# contio daemon config: copy to ~/.config/contio/config.toml
# Optional: everything works without it. Models installed with
# `contio install <model>` (or the GUI catalog) are saved by the daemon in
# ~/.local/share/contio/models.json. Models listed here are fixed (can't be
# changed or removed through the API) and win on id clashes.
# Paths may start with "~/".

[server]
listen = "127.0.0.1:8080"          # keep on localhost; the API has no auth yet

[manager]
idle_ttl_secs = 900                # unload unpinned models idle this long (0 = never)
startup_timeout_secs = 180
reserve_percent = 10               # share of each memory pool kept free

# Backends: installed automatically when the first model needs one (method from
# the GUI settings / PUT /api/settings; llama.cpp defaults to prebuilt), or
# explicitly:
#   contio backends install llama.cpp --method source|prebuilt|podman
#   contio backends install flm --method source
#   contio backends install whisper.cpp --method source
# or point at existing installs here (takes precedence over installed ones).

# llama.cpp: GGUF on GPU (Vulkan) or CPU. A Vulkan build serves both.
# Set exactly one of bin_dir (native) or image (podman).
[backends.llamacpp]
bin_dir = "~/.local/share/contio-spike/src/llama.cpp/build-vulkan/bin"
cpu_threads = 12                   # physical cores

# FastFlowLM: NPU (XDNA2). The env is set by contio; flm_env.sh is not used.
[backends.flm]
prefix = "~/.local/share/contio-spike/flm"
model_path = "~/.local/share/contio-spike/models"
# xrt_dir = "/opt/xilinx/xrt"
embed = true                       # co-load embed-gemma next to each NPU LLM
# asr = true                       # co-load Whisper (~1 GB more per NPU LLM); see the
#                                  # whisper-npu alias below

# whisper.cpp: speech to text on GPU (Vulkan) or CPU.
# [backends.whisper]
# bin_dir = "~/src/whisper.cpp/build/bin"
# cpu_threads = 12

# Agentic default: MoE on the GPU (docs/spikes/m0-gpu.md).
[[models]]
id = "qwen3.6-35b-a3b"
format = "gguf"
path = "~/.local/share/contio-spike/gguf/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
device = "gpu"
context = 32768
# pinned = true
# extra_args = ["--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]

[[models]]
id = "qwen3-8b-cpu"
format = "gguf"
path = "~/.local/share/contio-spike/gguf/Qwen3-8B-Q4_K_M.gguf"
device = "cpu"
context = 8192

[[models]]
id = "qwen3-4b-npu"
format = "flm"
tag = "qwen3-it:4b"
device = "npu"
context = 8192

# Speech to text (POST /v1/audio/transcriptions); `contio install whisper-large-v3-turbo` does this for you.
# [[models]]
# id = "whisper"
# format = "whisper"
# path = "~/models/ggml-large-v3-turbo-q8_0.bin"
# device = "gpu"
# kind = "transcription"

# Aliases: other names for models (spec §7.2). `upstream_model` overrides the
# name sent to the backend, e.g. to reach FLM's co-loaded embedding model.
# Aliases can also be added without a restart: `contio alias set <name> <model>`
# or the model editor on the GUI dashboard (saved in aliases.json).
[[aliases]]
name = "coder"
model = "qwen3.6-35b-a3b"

[[aliases]]
name = "embed-gemma"
model = "qwen3-4b-npu"
upstream_model = "embed-gemma:300m"

# NPU Whisper (needs asr = true above): transcriptions go to FLM's Whisper.
