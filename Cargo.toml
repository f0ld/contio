[workspace]
resolver = "3"
members = ["crates/*", "apps/gui/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
contio-core = { path = "crates/contio-core" }
contio-hw = { path = "crates/contio-hw" }
contio-backends = { path = "crates/contio-backends" }
contio-install = { path = "crates/contio-install" }
contio-catalog = { path = "crates/contio-catalog" }
contio-bench = { path = "crates/contio-bench" }

anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
sha2 = "0.11"
nix = { version = "0.31", features = ["signal"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "process", "sync", "fs", "io-util"] }
toml = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri size guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
