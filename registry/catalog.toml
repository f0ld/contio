# contio's curated model catalog (spec §4).
#
# Family → model → quantization. Only what can't be derived lives here:
# the source repo, kind, a recommended quant and a default context. Quant files
# and sizes are read live from Hugging Face; KV cache geometry, max context,
# parameter count and tool/reasoning support come from the GGUF headers via
# `scripts/catalog/geometry.py` (→ geometry.json, rerun after editing this file).
# Vision support = the repo ships an `mmproj` file.
#
# Fields per model:
#   id           API name suggestion and catalog key (lowercase)
#   kind         chat (default) | embedding | reranker
#   active_b     active parameters (billions) for MoE models
#   recommended  quant label picked by default (fallback: best one that fits)
#   context      default context when installing (capped at the model maximum)
#   tags         extra capabilities not visible in the template, e.g. "code"
#   flm          FastFlowLM tags for the same model on the NPU

[[families]]
id = "qwen"
name = "Qwen"
vendor = "Alibaba"
license = "Apache-2.0"
summary = "Strong general and coding models, from 0.8B to 35B MoE. The default choice for agents."

[[families]]
id = "gemma"
name = "Gemma"
vendor = "Google"
license = "Gemma"
summary = "Multimodal (vision, audio on E-models), long context via sliding-window attention."

[[families]]
id = "gpt-oss"
name = "gpt-oss"
vendor = "OpenAI"
license = "Apache-2.0"
summary = "Open-weight reasoning models with adjustable effort; MXFP4 is the native format."

[[families]]
id = "mistral"
name = "Mistral"
vendor = "Mistral AI"
license = "Apache-2.0"
summary = "Dense 24B models: Devstral for coding agents, Magistral for reasoning, Small for general use."

[[families]]
id = "glm"
name = "GLM"
vendor = "Z.ai"
license = "MIT"
summary = "MoE models with strong tool use; Flash variants fit a laptop."

[[families]]
id = "nemotron"
name = "Nemotron"
vendor = "NVIDIA"
license = "NVIDIA Open Model"
summary = "Hybrid Mamba/attention models with very long context."

[[families]]
id = "granite"
name = "Granite"
vendor = "IBM"
license = "Apache-2.0"
summary = "Business-oriented models with reliable tool calling."

[[families]]
id = "lfm"
name = "LFM"
vendor = "Liquid AI"
license = "LFM Open License"
summary = "Fast hybrid models built for on-device use."

[[families]]
id = "llama"
name = "Llama"
vendor = "Meta"
license = "Llama Community"
summary = "The classic baselines; widely supported by every tool."

[[families]]
id = "phi"
name = "Phi"
vendor = "Microsoft"
license = "MIT"
summary = "Small models trained on curated data; good reasoning per parameter."

[[families]]
id = "smollm"
name = "SmolLM"
vendor = "Hugging Face"
license = "Apache-2.0"
summary = "Fully open small models."

[[families]]
id = "embeddings"
name = "Embeddings"
vendor = "various"
license = "various"
summary = "Text embedding models for RAG and search (/v1/embeddings)."

[[families]]
id = "rerankers"
name = "Rerankers"
vendor = "various"
license = "various"
summary = "Cross-encoders that reorder search results (/v1/rerank)."

[[families]]
id = "speech"
name = "Whisper (speech to text)"
vendor = "OpenAI"
license = "MIT"
summary = "Transcription and translation to English (/v1/audio/transcriptions) via whisper.cpp; large-v3-turbo also on the NPU."

